# render.yaml — Configuración de despliegue en Render
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend Django ──────────────────────────────────────────────────────
  - type: web
    name: pda-sag-backend
    env: python
    region: oregon           # Cambia a la región más cercana si lo necesitas
    plan: free               # Cambiar a 'starter' o superior en producción
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --run-syncdb
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/lotes/
    envVars:
      - key: MONGODB_URI
        sync: false          # Se configura manualmente en el dashboard de Render
      - key: SECRET_KEY
        generateValue: true  # Render genera un valor seguro automáticamente
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # Ej: https://tu-app.vercel.app  (sin barra final)
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

  # ── Cron: limpieza de archivos cada hora ────────────────────────────────
  - type: cron
    name: pda-limpiar-archivos
    env: python
    region: oregon
    plan: free
    rootDir: backend
    schedule: "0 * * * *"   # Cada hora en punto
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py limpiar_archivos
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
